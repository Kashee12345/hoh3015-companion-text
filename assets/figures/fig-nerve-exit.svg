<svg viewBox="0 0 720 600" role="img"
  data-steps='["Start with the healthy segment. The intervertebral foramen is bounded above and below by the pedicles of the two vertebrae, in front by the disc and the backs of the two bodies, and behind by the facet joint and the ligamentum flavum. The nerve and its sheath sit in the upper part of it and take up only a fraction of the space. The rest is fat, small veins and connective tissue. In a healthy segment this opening is not tight.", "Now the two things that narrow it from the front. When a disc loses height the two bodies settle closer together and the opening loses height with them. When disc material displaces backward it enters the front of the opening directly. Both are changes you can see on imaging.", "And the two that narrow it from behind. An arthritic facet joint enlarges and crowds the opening from the back, and the ligamentum flavum thickens and buckles inward. Put two or three of these together and the opening can narrow enough to matter, which is what foraminal stenosis means.", "These four are the documented mechanisms, and every one of them is a change in tissue that can be seen. The claim that a vertebra merely sitting slightly out of position compresses the nerve is a different claim and a much stronger one, because it asks the opening to close without any of the tissue changes that are known to close it. A stronger claim needs stronger evidence, and that evidence has not been produced."]' aria-label="The intervertebral foramen in side view, drawn to scale: the opening bounded by the pedicles above and below, the disc and vertebral bodies in front and the facet joint behind is considerably larger than the nerve that passes through it, and the four documented ways it narrows are all changes in tissue rather than a vertebra sitting out of position.">
  <defs>
    <marker id="fig-nerve-exit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--fig-warn, #b4423a)"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="currentColor">
    <text x="16" y="24" font-weight="600">The intervertebral foramen, from the side</text>
    <text x="16" y="42" font-size="12" fill="var(--fig-mute, #8a939e)">two vertebrae, drawn to scale, with the nerve in cross section</text>

    <g stroke="currentColor" stroke-width="1.6" fill="var(--fig-fill, rgba(127,127,127,.08))">
      <rect x="60" y="90" width="144" height="68" rx="4"/>
      <rect x="60" y="188" width="144" height="67" rx="4"/>
      <rect x="204" y="107" width="53" height="31" rx="3"/>
      <rect x="204" y="208" width="53" height="31" rx="3"/>
      <rect x="257" y="107" width="58" height="22" rx="3"/>
      <rect x="257" y="217" width="58" height="22" rx="3"/>
      <rect x="257" y="152" width="18" height="86" rx="4"/>
      <rect x="275" y="121" width="18" height="86" rx="4"/>
      <path d="M 314 118 L 379 138" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M 314 228 L 379 248" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
    <rect x="60" y="157" width="144" height="31" rx="3" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="currentColor" stroke-width="1.6"/>
    <text x="118" y="177" text-anchor="middle" font-size="11" fill="var(--fig-mute, #8a939e)">disc</text>
    <path d="M 275 152 L 275 208" stroke="currentColor" stroke-width="2" fill="none"/>
    <ellipse cx="233" cy="173" rx="24" ry="35" fill="none" stroke="var(--fig-accent, #a95a22)" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="16" y="74" font-size="12" fill="var(--fig-mute, #8a939e)">one motion segment</text>
    <text x="16" y="278" font-size="11" fill="var(--fig-mute, #8a939e)">the dashed outline is the opening itself</text>

    <g data-step="1">
      <circle cx="230" cy="122" r="9.5" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="var(--fig-accent, #a95a22)" stroke-width="1.5"/>
      <text x="230" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-accent, #a95a22)">1</text>
      <circle cx="230" cy="223" r="9.5" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="var(--fig-accent, #a95a22)" stroke-width="1.5"/>
      <text x="230" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-accent, #a95a22)">2</text>
      <circle cx="190" cy="173" r="9.5" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="var(--fig-accent, #a95a22)" stroke-width="1.5"/>
      <text x="190" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-accent, #a95a22)">3</text>
      <circle cx="283" cy="173" r="9.5" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="var(--fig-accent, #a95a22)" stroke-width="1.5"/>
      <text x="283" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fig-accent, #a95a22)">4</text>
      <text x="400" y="86" font-weight="600">The four walls of the opening</text>
      <text x="400" y="112" font-size="12" font-weight="600" fill="var(--fig-accent, #a95a22)">1</text>
      <text x="416" y="112" font-size="12">roof: the pedicle of the vertebra above</text>
      <text x="400" y="134" font-size="12" font-weight="600" fill="var(--fig-accent, #a95a22)">2</text>
      <text x="416" y="134" font-size="12">floor: the pedicle of the vertebra below</text>
      <text x="400" y="156" font-size="12" font-weight="600" fill="var(--fig-accent, #a95a22)">3</text>
      <text x="416" y="156" font-size="12">front: the disc and the vertebral bodies</text>
      <text x="400" y="178" font-size="12" font-weight="600" fill="var(--fig-accent, #a95a22)">4</text>
      <text x="416" y="178" font-size="12">back: facet joint and ligamentum flavum</text>
      <circle cx="233" cy="155" r="13.8" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="var(--fig-brand, #0f5f66)" stroke-width="2.5"/>
      <text x="400" y="214" font-weight="600">The nerve inside it</text>
      <text x="400" y="238" font-size="12">The nerve and its sheath do not fill the</text>
      <text x="400" y="256" font-size="12">opening. Fat, small veins and connective</text>
      <text x="400" y="274" font-size="12">tissue take up the rest of the space.</text>
      <text x="400" y="298" font-size="12" font-weight="600" fill="var(--fig-brand, #0f5f66)">In a healthy segment this is not tight.</text>
    </g>

    <g data-step="2" data-pulse="">
      <rect x="16" y="330" width="164" height="126" rx="8" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="28" y="352" font-size="12" font-weight="600">Disc height loss</text>
      <text x="28" y="368" font-size="10" fill="var(--fig-mute, #8a939e)">the two bodies settle</text>
      <text x="28" y="382" font-size="10" fill="var(--fig-mute, #8a939e)">and the opening shortens</text>
      <ellipse cx="100" cy="416" rx="18" ry="26" fill="none" stroke="var(--fig-mute, #8a939e)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <ellipse cx="100" cy="416" rx="18" ry="15" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="2.2"/>
      <path d="M 100 376 L 100 396" stroke="var(--fig-warn, #b4423a)" fill="none" marker-end="url(#fig-nerve-exit-arrow)"/>
      <path d="M 100 456 L 100 436" stroke="var(--fig-warn, #b4423a)" fill="none" marker-end="url(#fig-nerve-exit-arrow)"/>
      <circle cx="99" cy="416" r="10" fill="none" stroke="var(--fig-brand, #0f5f66)" stroke-width="2"/>
    </g>
    <g data-step="2">
      <rect x="190" y="330" width="164" height="126" rx="8" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="202" y="352" font-size="12" font-weight="600">Disc herniation</text>
      <text x="202" y="368" font-size="10" fill="var(--fig-mute, #8a939e)">disc material displaces</text>
      <text x="202" y="382" font-size="10" fill="var(--fig-mute, #8a939e)">into the front of it</text>
      <ellipse cx="274" cy="416" rx="18" ry="26" fill="none" stroke="var(--fig-mute, #8a939e)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <path d="M 256 404 C 272 407 272 425 256 428" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="2.4"/>
      <circle cx="278" cy="406" r="10" fill="none" stroke="var(--fig-brand, #0f5f66)" stroke-width="2"/>
    </g>
    <g data-step="3" data-pulse="">
      <rect x="364" y="330" width="164" height="126" rx="8" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="376" y="352" font-size="12" font-weight="600">Facet hypertrophy</text>
      <text x="376" y="368" font-size="10" fill="var(--fig-mute, #8a939e)">an enlarged joint crowds</text>
      <text x="376" y="382" font-size="10" fill="var(--fig-mute, #8a939e)">the opening from behind</text>
      <ellipse cx="448" cy="416" rx="18" ry="26" fill="none" stroke="var(--fig-mute, #8a939e)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <path d="M 466 402 C 447 406 447 426 466 430" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="2.4"/>
      <circle cx="443" cy="405" r="10" fill="none" stroke="var(--fig-brand, #0f5f66)" stroke-width="2"/>
    </g>
    <g data-step="3">
      <rect x="538" y="330" width="164" height="126" rx="8" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="550" y="352" font-size="12" font-weight="600">Ligamentum flavum</text>
      <text x="550" y="368" font-size="10" fill="var(--fig-mute, #8a939e)">it thickens and buckles</text>
      <text x="550" y="382" font-size="10" fill="var(--fig-mute, #8a939e)">inward from behind</text>
      <ellipse cx="622" cy="416" rx="18" ry="26" fill="none" stroke="var(--fig-mute, #8a939e)" stroke-width="1.4" stroke-dasharray="4 3"/>
      <path d="M 639 411 C 625 419 625 431 638 438" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="2.4"/>
      <circle cx="619" cy="406" r="10" fill="none" stroke="var(--fig-brand, #0f5f66)" stroke-width="2"/>
    </g>
    <g data-step="2"><text x="16" y="318" font-size="12" font-weight="600">What actually narrows a foramen</text></g>

    <g data-step="4">
      <rect x="16" y="472" width="688" height="112" rx="8" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="1.6"/>
      <text x="32" y="498" font-weight="600" fill="var(--fig-warn, #b4423a)">What is documented, and what would need far more evidence</text>
      <text x="32" y="522" font-size="12">All four of these are changes in tissue: lost disc height, displaced disc material, an</text>
      <text x="32" y="540" font-size="12">enlarged facet joint, a thickened ligament. Each can be seen on imaging or at operation.</text>
      <text x="32" y="558" font-size="12">A vertebra merely sitting slightly out of position, with none of these tissue changes, is a</text>
      <text x="32" y="576" font-size="12">different and much stronger claim, and it would need much stronger evidence than exists.</text>
    </g>
  </g>
</svg>

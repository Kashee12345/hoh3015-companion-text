      <polyline points="136.0,181.0 140.6,194.3 145.4,207.6 150.1,220.9 154.4,234.1 158.0,247.4 160.7,260.7 162.0,274.0 161.6,287.3 159.8,300.6 157.0,313.9 153.6,327.1 149.7,340.4 145.7,353.7 142.0,367.0" fill="none" stroke="var(--fig-accent, #a95a22)" stroke-width="2.5" stroke-dasharray="7 5"/>

      <polyline points="136.0,367.0 133.6,374.9 130.5,382.7 126.7,390.6 123.0,398.4 120.5,406.3 119.9,414.1 120.9,422.0 122.9,429.9 125.7,437.7 129.0,445.6 132.6,453.4 136.4,461.3 140.3,469.1 144.0,477.0" fill="none" stroke="var(--fig-accent, #a95a22)" stroke-width="2.5" stroke-dasharray="7 5"/>
      <text x="16" y="410" font-size="12" font-weight="600" fill="var(--fig-accent, #a95a22)">lordosis</text>
      <text x="16" y="425" font-size="11" fill="var(--fig-mute, #8a939e)">convex forward</text>
      <polyline points="136.0,477.0 140.4,481.9 144.9,486.7 149.7,491.6 154.6,496.4 159.6,501.3 164.4,506.1 169.1,511.0 173.4,515.9 177.7,520.7 181.8,525.6 185.9,530.4 189.7,535.3 193.3,540.1 196.5,545.0" fill="none" stroke="var(--fig-accent, #a95a22)" stroke-width="2.5" stroke-dasharray="7 5"/>
      <text x="16" y="500" font-size="12" font-weight="600" fill="var(--fig-accent, #a95a22)">kyphosis</text>
      <text x="16" y="515" font-size="11" fill="var(--fig-mute, #8a939e)">convex backward</text>
      <text x="404" y="566" font-size="12" fill="var(--fig-accent, #a95a22)">a straight column would have to be rigid.</text>
      <text x="404" y="583" font-size="12" fill="var(--fig-accent, #a95a22)">four alternating curves let it flex and bear load.</text>
    </g>

    <g data-step="4" data-pulse="">
      <circle cx="162.0" cy="181" r="8" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="2.5"/>
      <path d="M 172.0 181 L 398 182" stroke="var(--fig-warn, #b4423a)" fill="none" stroke-dasharray="4 3"/>
      <text x="404" y="186" font-size="12" font-weight="600" fill="var(--fig-warn, #b4423a)">cervicothoracic junction</text>
      <text x="404" y="201" font-size="11" fill="var(--fig-mute, #8a939e)">a mobile neck sits on a ribbed cage</text>
      <circle cx="168.0" cy="367" r="8" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="2.5"/>
      <path d="M 178.0 367 L 398 358" stroke="var(--fig-warn, #b4423a)" fill="none" stroke-dasharray="4 3"/>
      <text x="404" y="362" font-size="12" font-weight="600" fill="var(--fig-warn, #b4423a)">thoracolumbar junction</text>
      <text x="404" y="377" font-size="11" fill="var(--fig-mute, #8a939e)">the ribs stop and rotation has to change hands</text>
      <circle cx="176.0" cy="477" r="8" fill="none" stroke="var(--fig-warn, #b4423a)" stroke-width="2.5"/>
      <path d="M 186.0 477 L 398 462" stroke="var(--fig-warn, #b4423a)" fill="none" stroke-dasharray="4 3"/>
      <text x="404" y="466" font-size="12" font-weight="600" fill="var(--fig-warn, #b4423a)">lumbosacral junction</text>
      <text x="404" y="481" font-size="11" fill="var(--fig-mute, #8a939e)">the last mobile segment sits on solid bone</text>

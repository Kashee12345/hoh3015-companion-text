    <g>
      <path d="M 248 88 L 242 88 L 242 181 L 248 181" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="256" y="128" font-weight="600">Cervical</text>
      <text x="256" y="145" font-size="12" fill="var(--fig-mute, #8a939e)">7 vertebrae</text>
      <path d="M 248 181 L 242 181 L 242 367 L 248 367" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="256" y="266" font-weight="600">Thoracic</text>
      <text x="256" y="283" font-size="12" fill="var(--fig-mute, #8a939e)">12 vertebrae</text>
      <path d="M 248 367 L 242 367 L 242 477 L 248 477" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="256" y="414" font-weight="600">Lumbar</text>
      <text x="256" y="431" font-size="12" fill="var(--fig-mute, #8a939e)">5 vertebrae</text>
      <path d="M 248 477 L 242 477 L 242 545 L 248 545" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="256" y="505" font-weight="600">Sacrum</text>
      <text x="256" y="522" font-size="12" fill="var(--fig-mute, #8a939e)">5 fused into one</text>
      <path d="M 248 545 L 242 545 L 242 577 L 248 577" fill="none" stroke="var(--fig-mute, #8a939e)"/>
      <text x="256" y="562" font-weight="600">Coccyx</text>
      <text x="256" y="579" font-size="12" fill="var(--fig-mute, #8a939e)">about 4 fused</text>
    </g>

    <g data-step="2">
      <text x="404" y="120" fill="var(--fig-accent, #a95a22)">most movement of any region</text>
      <text x="404" y="137" font-size="12" fill="var(--fig-mute, #8a939e)">carries only the weight of the head</text>
      <text x="404" y="258" fill="var(--fig-accent, #a95a22)">least movement per segment</text>
      <text x="404" y="275" font-size="12" fill="var(--fig-mute, #8a939e)">the ribs hold it, and it carries the chest</text>
      <text x="404" y="406" fill="var(--fig-accent, #a95a22)">large flexion, very little rotation</text>
      <text x="404" y="423" font-size="12" fill="var(--fig-mute, #8a939e)">carries everything above it</text>
      <text x="404" y="510" fill="var(--fig-accent, #a95a22)">no movement at all</text>
      <text x="404" y="527" font-size="12" fill="var(--fig-mute, #8a939e)">fused, it hands the load to the pelvis</text>
    </g>

    <g data-step="3">

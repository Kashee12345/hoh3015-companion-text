<svg viewBox="0 0 720 600" role="img"
  data-steps='["The column has to do two things that work against each other. It has to hold the head, arms and trunk up against gravity, and it has to let all of that move. Every design choice below is a compromise between those two.", "Each region settles the compromise differently. The neck moves most and carries least. The thoracic spine is tied to the ribs and moves least per segment. The lumbar spine carries everything above it. The sacrum gives up movement entirely and hands the load to the pelvis.", "The four curves are how a flexible column can still bear load. Cervical and lumbar are lordotic, convex toward the front. Thoracic and sacral are kyphotic, convex toward the back. A stack of alternating curves behaves like a spring, which a straight rod cannot.", "Where two regions meet, a mobile segment sits directly on a stiff one and load concentrates at the join. The cervicothoracic, thoracolumbar and lumbosacral junctions are the three places this happens, and they are where degenerative change and injury cluster."]' aria-label="The vertebral column in side view: five regions with 7 cervical, 12 thoracic and 5 lumbar vertebrae above a fused sacrum and coccyx, four alternating curves that let a flexible column carry load, and three junctions where the trade off between movement and support changes abruptly.">
  <defs>
    <marker id="fig-regions-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="currentColor">
    <g data-step="1">
      <text x="16" y="30" font-weight="600">Two jobs at once</text>
      <text x="16" y="48" font-size="12" fill="var(--fig-mute, #8a939e)">and every region settles them differently</text>
      <rect x="296" y="14" width="168" height="46" rx="8" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="var(--fig-brand, #0f5f66)" stroke-width="1.5"/>
      <text x="380" y="36" text-anchor="middle" font-weight="600" fill="var(--fig-brand, #0f5f66)">hold you up</text>
      <text x="380" y="53" text-anchor="middle" font-size="12" fill="var(--fig-mute, #8a939e)">carry the load down</text>
      <rect x="516" y="14" width="168" height="46" rx="8" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="var(--fig-accent, #a95a22)" stroke-width="1.5"/>
      <text x="600" y="36" text-anchor="middle" font-weight="600" fill="var(--fig-accent, #a95a22)">let you move</text>
      <text x="600" y="53" text-anchor="middle" font-size="12" fill="var(--fig-mute, #8a939e)">flex, bend and rotate</text>
      <path d="M 472 37 L 508 37" stroke="currentColor" fill="none" marker-start="url(#fig-regions-arrow)" marker-end="url(#fig-regions-arrow)"/>
      <text x="490" y="74" text-anchor="middle" font-size="12" fill="var(--fig-mute, #8a939e)">in tension</text>
    </g>

    <g stroke="currentColor" stroke-width="1.4" fill="var(--fig-fill, rgba(127,127,127,.08))">

<svg viewBox="0 0 740 520" role="img" aria-label="Six professions that touch the spine or the tissue around it, drawn as overlapping regions rather than a table. Spinal manipulation itself is shared by chiropractors, osteopathic physicians and physical therapists, and several other overlaps are just as real, which is why the scope disputes in this chapter were so bitter.">
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12">
    <text x="370" y="26" text-anchor="middle" font-size="15" font-weight="600">Who else treats the spine</text>
    <text x="370" y="44" text-anchor="middle" fill="var(--fig-mute, #8a939e)">drawn where training genuinely overlaps, not as a table</text>

    <g data-hot="Massage therapist" data-tip="Licensing requirements vary widely by state, typically several hundred hours of hands on training and an exam. Massage therapists do not diagnose conditions or perform spinal manipulation.">
      <rect x="40" y="60" width="160" height="200" rx="10" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="currentColor"/>
      <text x="85" y="95" text-anchor="middle" font-weight="600" font-size="13">Massage</text>
      <text x="85" y="111" text-anchor="middle" font-weight="600" font-size="13">therapist</text>
      <text x="85" y="145" text-anchor="middle" fill="var(--fig-mute, #8a939e)">no diagnosis</text>
      <text x="85" y="161" text-anchor="middle" fill="var(--fig-mute, #8a939e)">or joint</text>
      <text x="85" y="177" text-anchor="middle" fill="var(--fig-mute, #8a939e)">manipulation</text>
    </g>

    <g data-hot="Doctor of chiropractic" data-tip="A four year professional degree after undergraduate coursework, with at least 4200 instructional hours including 1000 hours of supervised patient care, followed by national board exams for licensure.">
      <rect x="130" y="60" width="280" height="200" rx="10" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="currentColor"/>
      <text x="250" y="95" text-anchor="middle" font-weight="600" font-size="13">Chiropractor</text>
      <text x="250" y="111" text-anchor="middle" font-weight="600" font-size="13">(DC)</text>
      <text x="250" y="135" text-anchor="middle" fill="var(--fig-mute, #8a939e)">spinal</text>
      <text x="250" y="151" text-anchor="middle" fill="var(--fig-mute, #8a939e)">adjustment</text>
    </g>

    <g data-hot="Physical therapist" data-tip="A three year Doctor of Physical Therapy degree after a bachelor's degree, followed by a national licensure exam. No prescribing authority and, in most states, no surgical authority.">
      <rect x="300" y="60" width="280" height="200" rx="10" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="currentColor"/>
      <text x="460" y="95" text-anchor="middle" font-weight="600" font-size="13">Physical</text>
      <text x="460" y="111" text-anchor="middle" font-weight="600" font-size="13">therapist (PT)</text>
      <text x="460" y="135" text-anchor="middle" fill="var(--fig-mute, #8a939e)">movement</text>
      <text x="460" y="151" text-anchor="middle" fill="var(--fig-mute, #8a939e)">analysis</text>
    </g>

    <g data-hot="Acupuncturist" data-tip="Typically a three year master's level program plus national certification. Scope is centered on needle based treatment under a separate licensing system from medicine or chiropractic.">
      <rect x="510" y="60" width="160" height="200" rx="10" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="currentColor"/>
      <text x="590" y="95" text-anchor="middle" font-weight="600" font-size="13">Acupuncturist</text>
      <text x="590" y="135" text-anchor="middle" fill="var(--fig-mute, #8a939e)">meridian based</text>
      <text x="590" y="151" text-anchor="middle" fill="var(--fig-mute, #8a939e)">needle system</text>
      <text x="590" y="175" text-anchor="middle" fill="var(--fig-mute, #8a939e)">licensed</text>
      <text x="590" y="191" text-anchor="middle" fill="var(--fig-mute, #8a939e)">separately</text>
    </g>

    <g data-hot="Osteopathic physician" data-tip="A four year medical degree covering the same coursework as an MD plus hands on osteopathic manipulative training, followed by a residency of three to seven years depending on specialty.">
      <rect x="200" y="170" width="310" height="220" rx="10" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="currentColor"/>
      <text x="310" y="295" text-anchor="middle" font-weight="600" font-size="14">Osteopathic physician (DO)</text>
      <text x="310" y="319" text-anchor="middle" fill="var(--fig-mute, #8a939e)">full physician license plus</text>
      <text x="310" y="335" text-anchor="middle" fill="var(--fig-mute, #8a939e)">hands on manipulation training</text>
    </g>

    <g data-hot="Medical physician" data-tip="A four year medical degree followed by a residency of three to seven years depending on specialty. Broad authority to prescribe and operate, but manual spine treatment is not a required part of training.">
      <rect x="420" y="260" width="280" height="220" rx="10" fill="var(--fig-fill, rgba(127,127,127,.08))" stroke="currentColor"/>
      <text x="555" y="300" text-anchor="middle" font-weight="600" font-size="14">Medical physician (MD)</text>
      <text x="555" y="324" text-anchor="middle" fill="var(--fig-mute, #8a939e)">broadest prescribing and</text>
      <text x="555" y="340" text-anchor="middle" fill="var(--fig-mute, #8a939e)">surgical scope</text>
      <text x="555" y="364" text-anchor="middle" fill="var(--fig-mute, #8a939e)">no required training in</text>
      <text x="555" y="380" text-anchor="middle" fill="var(--fig-mute, #8a939e)">manual spine treatment</text>
    </g>

    <text x="165" y="142" text-anchor="middle">soft</text>
    <text x="165" y="158" text-anchor="middle">tissue</text>
    <text x="165" y="174" text-anchor="middle">work</text>

    <text x="545" y="138" text-anchor="middle">dry</text>
    <text x="545" y="154" text-anchor="middle">needling</text>
    <text x="545" y="176" text-anchor="middle">trigger</text>
    <text x="545" y="192" text-anchor="middle">points</text>

    <text x="355" y="100" text-anchor="middle">exercise</text>
    <text x="355" y="116" text-anchor="middle">prescription</text>

    <text x="250" y="205" text-anchor="middle">soft tissue</text>
    <text x="250" y="221" text-anchor="middle">treatment</text>

    <text x="460" y="205" text-anchor="middle">movement</text>
    <text x="460" y="221" text-anchor="middle">based rehab</text>

    <text x="465" y="283" text-anchor="middle">prescribing</text>
    <text x="465" y="299" text-anchor="middle">medication</text>
    <text x="465" y="315" text-anchor="middle">diagnosis and</text>
    <text x="465" y="331" text-anchor="middle">surgery</text>

    <rect x="305" y="176" width="100" height="78" rx="6" fill="none" stroke="var(--fig-accent, #a95a22)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="355" y="200" text-anchor="middle" font-weight="600" fill="var(--fig-accent, #a95a22)">spinal</text>
    <text x="355" y="216" text-anchor="middle" font-weight="600" fill="var(--fig-accent, #a95a22)">manipulation</text>
    <text x="355" y="240" text-anchor="middle" fill="var(--fig-accent, #a95a22)">DC, DO, PT</text>
  </g>
</svg>
